# 자동 합치기: 값(데이터)만 고친 수정 제안이 검사를 통과하면 관리자 없이 바로 합친다.
#  - 지도 데이터(data/campuses/…/*.json)와 하위 주소 신청(subdomains/<이름>.json)만 대상.
#  - 코드·설정·장식 파일이 하나라도 섞이면 합치지 않고 「사람 확인 필요」로 남긴다.
#  - 안전: 제안 쪽 코드는 실행하지 않는다. 데이터 파일 내용만 꺼내 main의 검사 도구로 검사한다.
name: 자동 합치기
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  merge:
    name: 값만 고친 제안 자동 합치기
    if: github.event.pull_request.draft == false && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: main 내려받기(검사 도구는 main 것을 씀)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 제안 내용 가져오기(실행하지 않음)
        run: |
          git fetch --no-tags origin "+refs/pull/${PR}/head:refs/remotes/pr/head"
          test "$(git rev-parse refs/remotes/pr/head)" = "$HEAD_SHA"
          gh api "repos/${{ github.repository }}/pulls/${PR}/files" --paginate --jq '[.[] | {filename, status}]' | jq -s 'add' > "$RUNNER_TEMP/files.json"
          cat "$RUNNER_TEMP/files.json"
      - name: 값만 바뀌었는지 확인하고 파일 꺼내기
        id: gate
        run: |
          set +e
          python3 tools/automerge_gate.py "$RUNNER_TEMP/files.json" "$HEAD_SHA"
          code=$?
          if [ $code -eq 10 ]; then echo "eligible=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ $code -ne 0 ]; then exit $code; fi
          echo "eligible=yes" >> "$GITHUB_OUTPUT"
      - name: 데이터 검사
        if: steps.gate.outputs.eligible == 'yes'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/check.py --changed $(jq -r '.[].filename' "$RUNNER_TEMP/files.json")
      - name: 지도 만들기 확인
        if: steps.gate.outputs.eligible == 'yes'
        run: python3 tools/build.py > /dev/null
      - name: 합치기
        if: steps.gate.outputs.eligible == 'yes'
        run: |
          gh pr merge "$PR" --repo "${{ github.repository }}" --squash --match-head-commit "$HEAD_SHA" \
            || { gh pr comment "$PR" --repo "${{ github.repository }}" --body "검사는 통과했지만 자동으로 합치지 못했어요(다른 수정과 겹쳤을 수 있어요). main의 최신 내용으로 다시 맞춘 뒤 저장하면 다시 시도해요."; exit 1; }
          gh pr comment "$PR" --repo "${{ github.repository }}" --body "✅ 검사를 통과해서 자동으로 합쳤어요. 몇 분 뒤 cukmap.com 에 반영돼요. 고쳐 주셔서 고마워요!"
      - name: 자동 합치기 대상이 아님 안내
        if: steps.gate.outputs.eligible == 'no' && github.event.action == 'opened'
        env:
          REASON: ${{ steps.gate.outputs.reason }}
        run: |
          gh pr comment "$PR" --repo "${{ github.repository }}" --body "이 제안은 지도 값(데이터)이나 하위 주소 신청 말고도 다른 파일이 바뀌어서 자동으로 합치지 않아요. 코드를 아는 참여자가 확인한 뒤 합쳐 줄 거예요. ($REASON)"
      - name: 검사 실패 안내
        if: failure() && steps.gate.outputs.eligible == 'yes'
        run: |
          gh pr comment "$PR" --repo "${{ github.repository }}" --body "❌ 자동 검사에서 고칠 곳이 나왔어요. 아래 **Checks → 자동 검사** 결과의 안내대로 고친 뒤 다시 저장하면 다시 검사해요."
