<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>cukmap · 활용 프로젝트</title>
<meta name="description" content="cukmap(가톨릭대학교 지도)을 활용해 학생들이 만든 프로젝트 목록. 누구나 이름.cukmap.com 주소로 프로젝트를 올릴 수 있어요.">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Malgun Gothic",sans-serif;background:#f4f7f3;color:#26392f;line-height:1.6}
a{color:#244f3d}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 24px;background:#fff;border-bottom:1px solid #d9e2da}
.brand{letter-spacing:2px;font-size:20px;font-weight:900;text-decoration:none;color:#1d3a2c}.brand span{font-weight:400}
.top nav{display:flex;gap:6px}.top nav a{font-size:12px;text-decoration:none;border:1px solid #d7e2db;border-radius:9px;padding:9px 12px;background:#fff}
.top nav a.hot{background:#e8552e;border-color:#e8552e;color:#fff}
main{max-width:920px;margin:0 auto;padding:28px 20px 60px}
h1{font-size:26px;margin:0 0 6px}.lead{color:#5b6f62;margin:0 0 18px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.sort{display:flex;gap:6px}.sort button{font:inherit;font-size:13px;border:1px solid #d7e2db;border-radius:9px;padding:7px 12px;background:#fff;color:#244f3d;cursor:pointer}.sort button.on{background:#244f3d;color:#fff;border-color:#244f3d}
.add{font-size:13px;text-decoration:none;border:1px solid #e8552e;color:#c2401c;border-radius:9px;padding:7px 12px;background:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:#fff;border:1px solid #dfe7e0;border-radius:14px;padding:16px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:6px}
.card:hover{border-color:#9cc3a8;box-shadow:0 4px 14px #1c44201a}
.card h2{font-size:16px;margin:0}.card .u{font-size:12px;color:#2d7a4c;font-weight:700}.card p{margin:0;font-size:13px;color:#4d6355}
.card .m{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap;font-size:11.5px;color:#6b7a70}
.pin{background:#fff1ea;color:#c2401c;border-radius:6px;padding:0 6px;font-weight:700}
.empty{background:#fff;border:1px dashed #cfd9d1;border-radius:14px;padding:26px;text-align:center;color:#5b6f62}
@media(max-width:600px){.top{padding:12px}.top nav a{padding:7px 9px;font-size:11px}h1{font-size:22px}}
</style>
</head>
<body>
<header class="top"><a class="brand" href="/">cuk<span>map</span></a><nav><a href="/">홈</a><a href="/contributors/">함께 만든 사람들</a><a class="hot" href="/edit/">오류 제보</a></nav></header>
<main>
<h1>활용 프로젝트</h1>
<p class="lead">cukmap 지도를 활용해 만든 프로젝트예요. 누구나 <b>이름.cukmap.com</b> 주소로 자기 프로젝트를 올릴 수 있어요.</p>
<div class="bar">
<div class="sort"><button data-s="hot" class="on">인기(최근 7일)</button><button data-s="new">최신순</button><button data-s="old">오래된 순</button></div>
<a class="add" href="https://github.com/cukmap/map/tree/main/subdomains">＋ 내 프로젝트 올리기</a>
</div>
<div id="list"><div class="empty">불러오는 중…</div></div>
</main>
<script>
(()=>{const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
let ps=[],sort='hot';const list=document.getElementById('list');
const render=()=>{list.textContent='';
 if(!ps.length){const d=el('div','empty');d.append('아직 등록된 프로젝트가 없어요. 첫 번째 프로젝트를 ');const a=el('a',null,'올려 보세요');a.href='https://github.com/cukmap/map/tree/main/subdomains';d.append(a,'.');list.appendChild(d);return}
 const by={hot:(a,b)=>b.visits7-a.visits7||b.since-a.since,new:(a,b)=>b.since-a.since,old:(a,b)=>a.since-b.since}[sort];
 const arr=[...ps].sort((a,b)=>(b.pinned-a.pinned)||by(a,b));const g=el('div','grid');
 for(const p of arr){const c=el('a','card');c.href=p.url;c.target='_blank';c.rel='noopener';c.append(el('h2',null,p.title||p.name),el('span','u',p.name+'.cukmap.com'),el('p',null,p.description||''));
  const m=el('div','m');if(p.pinned)m.appendChild(el('span','pin','추천'));m.append(el('span',null,p.team||''),el('span',null,'최근 7일 방문 '+p.visits7));c.appendChild(m);g.appendChild(c)}
 list.appendChild(g)};
document.querySelectorAll('.sort button').forEach(b=>b.onclick=()=>{sort=b.dataset.s;document.querySelectorAll('.sort button').forEach(x=>x.classList.toggle('on',x===b));render()});
fetch('/api/projects').then(r=>r.ok?r.json():Promise.reject()).then(j=>{ps=j.projects||[];render()}).catch(()=>{list.textContent='';list.appendChild(el('div','empty','목록을 불러오지 못했어요. 잠시 후 새로고침해 주세요.'))});
})();
</script>
</body>
</html>
